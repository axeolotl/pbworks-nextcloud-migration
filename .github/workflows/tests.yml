name: Tests
on: [push, pull_request]
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y pandoc php-cli php-mbstring php-xml composer patch
          python -m pip install uv
      - run: uv sync --locked
      - run: PYTHONPATH=scripts uv run python -m unittest discover -s tests -v
      - run: bash tests/run_php_tests.sh
